    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // DOMParser/replaceWith are inert per spec — re-create each with

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

icro-label {\n  font-family: var(--font-mono);\n  font-size: var(--text-micro);\n  letter-spacing: var(--tracking-micro);\n  text-transform: uppercase;\n  line-height: 1.2;\n}\n<\u002Fstyle>\n<style>/* 4px base, six steps ever used. Sections breathe at 64, cards pad at 20-24,\n   related things sit 8-12 apart. Constraint is the point. */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;   /* icon to label, chip to chip */\n  --space-3: 12px;  /* buttons in a row, grid gap between cards */\n  --space-4: 16px;  /* inside a card, between blocks */\n  --space-5: 20px;  /* small card padding */\n  --space-6: 24px;  /* card padding (p-6) + the universal page gutter */\n  --space-8: 32px;\n  --space-10: 40px; /* header to first section */\n  --space-14: 56px; /* header block to card grid (mt-14) */\n  --space-16: 64px; /* between sections */\n  --space-20: 80px; /* page top/bottom padding (py-20) */\n  --space-24: 96px; /* hero section padding (py-24) */\n\n  /* layout */\n  --page-max: 72rem;   /* max-w-6xl \u2014 landing, work, about */\n  --prose-max: 36rem;  /* max-w-xl \u2014 a single column of prose */\n  --lede-max: 28rem;   /* max-w-md/sm \u2014 hero copy */\n  --page-inset: var(--space-6);\n  --header-height: 3rem; /* h-12 sticky header */\n\n  /* breakpoints (width only \u2014 there is no isMobile anywhere) */\n  --bp-sm: 640px;\n  --bp-md: 768px;\n  --bp-lg: 1024px;\n}\n<\u002Fstyle>\n<style>/* Radius scales with the surface. One border weight everywhere: 1px at token\n   colour. No shadows in the layout system \u2014 depth comes from surface\n   lightness; the only shadow-lg in the source is the popover. */\n\n:root {\n  --radius: 0.625rem; /* 10px \u2014 the scale's root (shadcn --radius) */\n  --radius-sm: calc(var(--radius) * 0.6);  /* 6px  chips, code */\n  --radius-md: calc(var(--radius) * 0.8);  /* 8px  inputs */\n  --radius-lg: var(--radius);              /* 10px */\n  --radius-xl: calc(var(--radius) * 1.4);  /* 14px specimen frames */\n  --radius-2xl: ca  transparent); padding: 2px 6px; font-size: var(--text-10); letter-spacing: var(--tracking-label); color: var(--text-4); }\n\n/* ---- status dot ------------------------------------------------------ */\n.ch-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: var(--weight-light); }\n.ch-status i { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; }\n\n/* ---- hairline -------------------------------------------------------- */\n.ch-hairline { height: 1px; background: var(--hairline); border: 0; margin: 0; }\n\n/* ---- form controls --------------------------------------------------- */\n.ch-field { display: block; }\n.ch-label { display: block; font-size: var(--text-10); font-weight: var(--weight-medium); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-5); }\n.ch-input { display: block; width: 100%; box-sizing: border-box; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--background); padding: 10px 12px; font-family: var(--font-sans); font-size: var(--text-13); color: var(--foreground); transition: border-color var(--dur-hover) var(--ease-standard); }\n.ch-input::placeholder { color: var(--text-6); }\n.ch-input:focus { outline: none; border-color: color-mix(in oklch, var(--foreground) 30%, transparent); }\n.ch-input--area { min-height: 80px; resize: vertical; line-height: var(--leading-relaxed); }\n.ch-hint { margin: 6px 0 0; font-size: 11px; font-weight: var(--weight-light); color: var(--text-5); }\n.ch-search { display: flex; align-items: center; gap: 8px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--background); padding: 10px 12px; }\n.ch-search input { flex: 1; border: 0; background: transparent; outline: none; font-family: var(--font-sans); font-size: var(--text-13); color: var(--foreground); }\n.ch-search input::placeholder { color: var(--text-6); }\n.ch-search svg { width: 14px; height: 14px; color: var(--text-6); flex-shrink: 0; }\n\n.ch-choice { display: inline-flex; align-items: center; gap: 10px; font-size: var(--text-13); font-weight: var(--weight-light); color: var(--text-3); }\n.ch-choice--on { color: var(--text-2); }\n.ch-box { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; border-radius: 4px; border: 1px solid var(--border); background: var(--background); transition: all var(--dur-hover) var(--ease-standard); }\n.ch-box--on { border-color: color-mix(in oklch, var(--foreground) 40%, transparent); background: var(--foreground); color: var(--background); }\n.ch-box--on svg { width: 12px; height: 12px; }\n.ch-radio { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--background); }\n.ch-radio--on { border-color: color-mix(in oklch, var(--foreground) 40%, transparent); }\n.ch-radio--on i { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--foreground); }\n.ch-toggle { display: inline-flex; align-items: center; width: 36px; height: 20px; flex-shrink: 0; padding: 2px; box-sizing: border-box; border-radius: var(--radius-full); border: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 40%, transparent); transition: background var(--dur-hover) var(--ease-standard); }\n.ch-toggle i { width: 14px; height: 14px; border-radius: var(--radius-full); background: var(--muted-foreground); transition: transform var(--dur-swap) var(--ease-standard); }\n.ch-toggle--on { background: var(--foreground); }\n.ch-toggle--on i { background: var(--background); transform: translateX(16px); }\n\n/* ---- tabs ------------------------------------------------------------ */\n.ch-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-left: -10px; }\n.ch-tab { border: 0; background: transparent; padding: 4px 10px; font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--weight-light); letter-spacing: 0.02em; color: var(--text-5); transition: color var(--dur-hover) var(--ease-standard); }\n.ch-tab:hover { color: var(--foreground); }\n.ch-tab--active { color: var(--text-accent); }\n\n/* ---- menu ------------------------------------------------------------ */\n.ch-menu { min-width: 128px; border-radius: var(--radius-2xl); background: var(--popover); color: var(--popover-foreground); padding: 4px; box-shadow: var(--shadow-popover); outline: 1px solid color-mix(in oklch, var(--foreground) 5%, transparent); }\n.dark .ch-menu { outline-color: color-mix(in oklch, var(--foreground) 10%, transparent); }\n.ch-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 28px; border: 0; background: transparent; border-radius: var(--radius-xl); padding: 6px 8px; font-family: var(--font-sans); font-size: var(--text-sm); color: inherit; text-align: left; transition: background var(--dur-hover) var(--ease-standard); }\n.ch-menu-item:hover, .ch-menu-item:focus-visible { background: var(--accent); color: var(--accent-foreground); outline: none; }\n.ch-menu-sep { height: 1px; margin: 4px -4px; background: color-mix(in oklch, var(--border) 50%, transparent); border: 0; }\n\n/* ---- code ------------------------------------------------------------ */\n.ch-code { border-radius: 4px; background: color-mix(in oklch, var(--muted) 60%, transparent); padding: 2px 4px; font-family: var(--font-mono); font-size: var(--text-xs); }\n.ch-code-block { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid color-mix(in oklch, var(--border) 80%, transparent); background: color-mix(in oklch, var(--muted) 30%, transparent); padding: var(--space-4); margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: var(--leading-relaxed); color: var(--text-2); }\n\n/* ---- prose list ------------------------------------------------------ */\n.ch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: var(--text-13); font-weight: var(--weight-light); line-height: var(--leading-relaxed); color: var(--text-3); }\n.ch-list li { display: flex; gap: 12px; }\n.ch-list li > i { margin-top: 7px; width: 4px; height: 4px; flex-shrink: 0; border-radius: var(--radius-full); background: var(--text-6); }\n.ch-list b { font-weight: var(--weight-normal); color: var(--text-2); }\n\n/* ---- table ----------------------------------------------------------- */\n.ch-table { width: 100%; border-collapse: collapse; text-align: left; }\n.ch-table thead tr { border-bottom: 1px solid var(--border); }\n.ch-table th { padding: 0 16px 8px 0; font-size: var(--text-10); font-weight: var(--weight-medium); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-5); }\n.ch-table tbody tr { border-bottom: 1px solid var(--rule-soft); }\n.ch-table td { padding: 8px 16px 8px 0; font-size: var(--text-xs); font-weight: var(--weight-light); color: var(--text-3); vertical-align: top; }\n.ch-table td:first-child { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }\n\n/* ---- media frame ----------------------------------------------------- */\n.ch-media { overflow: hidden; border-radius: var(--radius-md); border: 1px solid color-mix(in oklch, var(--border) 80%, transparent); background: color-mix(in oklch, var(--muted) 10%, transparent); display: flex; align-items: center; justify-content: center; }\n.ch-media img { display: block; width: 100%; height: 100%; object-fit: cover; }\n.ch-media-caption { margin: 6px 0 0; font-size: 11px; font-weight: var(--weight-light); color: var(--text-4); }\n\n/* ---- section header -------------------------------------------------- */\n.ch-sh-title { margin: 8px 0 0; font-family: var(--font-sans); font-size: var(--text-h2); font-weight: var(--weight-light); letter-spacing: var(--tracking-tight); line-height: 1.2; color: var(--foreground); }\n.ch-sh-stand { margin: 8px 0 0; max-width: var(--prose-max); font-size: var(--text-13); font-weight: var(--weight-light); line-height: var(--leading-relaxed); color: var(--text-3); }\n\n/* ---- quiet inline link (the site's one link treatment) --------------- */\n.ch-link { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-sm); color: var(--text-3); transition: color var(--dur-hover) var(--ease-standard); }\n.ch-link:hover { color: var(--foreground); }\n.ch-link svg { width: 14px; height: 14px; transition: transform var(--dur-hover) var(--ease-standard); }\n.ch-link:hover svg { transform: translate(2px, -2px); }\n.ch-link--accent { color: var(--text-accent); }\n\n/* ---- animation layer -------------------------------------------------\n   The site's entrance and hover motion, lifted from the Tailwind classes it\n   composes (tw-animate-css: animate-in fade-in slide-in-from-bottom-2\n   duration-700 fill-mode-backwards, plus the 120ms stagger). One rule\n   governs all of it: energy moves space, never brightness. */\n@keyframes ch-enter { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }\n@keyframes ch-reveal { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }\n@keyframes ch-fade { from { opacity: 0 } to { opacity: 1 } }\n\n@media (prefers-reduced-motion: no-preference) {\n  /* hero + section entrance; set --step=\"0,1,2\u2026\" for the top-to-bottom stagger */\n  .ch-enter { animation: ch-enter var(--dur-entrance) var(--ease-out) backwards; animation-delay: calc(var(--step, 0) * var(--stagger-step)) }\n  /* scroll reveal: add .is-in when the element enters the viewport */\n  .ch-reveal { opacity: 0 }\n  .ch-reveal.is-in { animation: ch-reveal var(--dur-reveal) var(--ease-out) forwards }\n  /* tab / panel content swap */\n  .ch-fade { animation: ch-fade var(--dur-swap) var(--ease-standard) }\n}\n\n/* hover lift \u2014 the work cards. Transition, not animation, so it reverses. */\n.ch-lift { transition: transform var(--dur-swap) var(--ease-standard), background var(--dur-swap) var(--ease-standard) }\n.ch-lift:hover { transform: translateY(-2px) }\n/* the arrow nudge on every onward link (see .ch-link) */\n.ch-nudge { transition: transform var(--dur-hover) var(--ease-standard) }\n:hover > .ch-nudge, .ch-nudge:hover { transform: translate(2px, -2px) }\n/* image hover scale \u2014 the only 300ms in the system */\n.ch-zoom { overflow: hidden }\n.ch-zoom img { transition: transform var(--dur-media) var(--ease-standard) }\n.ch-zoom:hover img { transform: scale(1.03) }\n<\u002Fstyle>\n<style>/* circleheads design system \u2014 global entry point.\n   Consumers link this one file. Ported from\n   circleheads-site/packages/ui/src/styles/globals.css (values are the design;\n   see readme.md \u00a7 VISUAL FOUNDATIONS). */\n/* Two families, both Google Fonts \u2014 the site loads them via next/font\n   (Inter as --font-sans, Geist Mono as --font-mono). No local binaries exist\n   in the source repo, so we load the same families from Google's CDN and the\n   /* cyrillic */\n/* symbols2 */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n/* cyrillic-ext */\n/* cyrillic */\n/* greek-ext */\n/* greek */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n/* cyrillic-ext */\n/* cyrillic */\n/* greek-ext */\n/* greek */\n/* vietnamese */\n/* latin-ext */\n/* latin */\n:root {\n  --font-sans: \"Inter\", ui-sans-serif, system-ui, sans-serif;\n  --font-mono: \"Geist Mono\", ui-monospace, SFMono-Regular, monospace;\n  /* the site aliases headings to the sans stack \u2014 there is no display face */\n  --font-heading: var(--font-sans);\n}\n\n/* Hand-tuned theme tokens (ADR 0002). Light = warm paper, dark = warm\n   near-black; hierarchy comes from alpha, not hue. DARK IS THE SITE DEFAULT:\n   put class=\"dark\" on <html>. Accents are punctuation \u2014 dots, one phrase, the\n   cars \u2014 never fills. */\n\n:root {\n  /* --- base surfaces + ink (light: warm paper #FAFAF8 / #141413) --- */\n  --background: oklch(0.983 0.002 107);\n  --foreground: oklch(0.16 0.002 107);\n  --card: oklch(0.993 0.002 107);\n  --card-foreground: oklch(0.16 0.002 107);\n  --popover: oklch(0.993 0.002 107);\n  --popover-foreground: oklch(0.16 0.002 107);\n  --primary: oklch(0.2 0.003 107);\n  --primary-foreground: oklch(0.985 0.002 107);\n  --secondary: oklch(0.93 0.005 95);\n  --secondary-foreground: oklch(0.21 0.006 95);\n  --muted: oklch(0.93 0.005 95);\n  --muted-foreground: oklch(0.5 0.008 95);\n  --accent: oklch(0.93 0.005 95);\n  --accent-foreground: oklch(0.21 0.006 95);\n  --destructive: oklch(0.577 0.245 27.325);\n  --border: oklch(0.19 0.01 95 / 12%);\n  --input: oklch(0.19 0.01 95 / 16%);\n  --ring: oklch(0.5 0.008 95);\n\n  /* --- the hand-maintained accent block (ADR 0002) --- */\n  --accent-blue: oklch(0.55 0.19 259);\n  --accent-green: oklch(0.5 0.09 152);\n  --accent-amber: oklch(0.62 0.13 75);\n  --accent-rose: oklch(0.58 0.16 15);\n  --accent-violet: oklch(0.52 0.15 295);\n  --chart-1: var(--accent-blue);\n  --chart-2: var(--accent-green);\n  --chart-3: var(--accent-amber);\n  --chart-4: var(--accent-rose);\n  --chart-5: var(--accent-violet);\n\n  /* --- semantic aliases (this system's additions, one indirection over the\n         raw tokens above; the site writes bg-card/40 etc. inline) --- */\n  --surface-page: var(--background);\n  --surface-card: color-mix(in oklch, var(--card) 40%, transparent);\n  --surface-card-solid: var(--card);\n  --surface-inset: color-mix(in oklch, var(--muted) 15%, transparent);\n  --surface-raised: var(--popover);\n  --rule: var(--border);\n  --rule-soft: color-mix(in oklch, var(--border) 40%, transparent);\n\n  /* the opacity ladder \u2014 six steps, and that is the whole hierarchy */\n  --text-1: var(--foreground);\n  --text-2: color-mix(in oklch, var(--foreground) 85%, transparent);\n  --text-3: var(--muted-foreground);\n  --text-4: color-mix(in oklch, var(--muted-foreground) 70%, transparent);\n  --text-5: color-mix(in oklch, var(--muted-foreground) 50%, transparent);\n  --text-6: color-mix(in oklch, var(--muted-foreground) 40%, transparent);\n  --text-inverse: var(--primary-foreground);\n  --text-accent: var(--accent-blue);\n}\n\n.dark {\n  --background: oklch(0.146 0.002 107);\n  --foreground: oklch(0.937 0.003 107);\n  --card: oklch(0.176 0.002 107);\n  --card-foreground: oklch(0.937 0.003 107);\n  --popover: oklch(0.176 0.002 107);\n  --popover-foreground: oklch(0.937 0.003 107);\n  --primary: oklch(0.937 0.003 107);\n  --primary-foreground: oklch(0.155 0.002 107);\n  --secondary: oklch(0.22 0.002 107);\n  --secondary-foreground: oklch(0.937 0.003 107);\n  --muted: oklch(0.21 0.002 107);\n  --muted-foreground: oklch(0.63 0.004 107);\n  --accent: oklch(0.22 0.002 107);\n  --accent-foreground: oklch(0.937 0.003 107);\n  --destructive: oklch(0.704 0.191 22.216);\n  --border: oklch(1 0 0 / 10%);\n  --input: oklch(1 0 0 / 13%);\n  --ring: oklch(0.6 0.004 107);\n  --accent-blue: oklch(0.68 0.15 259);\n  --accent-green: oklch(0.71 0.11 152);\n  --accent-amber: oklch(0.83 0.12 80);\n  --accent-rose: oklch(0.7 0.15 15);\n  --accent-violet: oklch(0.75 0.11 295);\n}\n\n/* --- art-layer constants -------------------------------------------------\n   Fixed hexes, NOT theme tokens: the pixel engines and the reveal cards keep\n   these across both themes (mid-toned so they sit on paper and near-black\n   alike). Never use them for UI chrome. */\n:root {\n  /* face accents cycled by the hero head (pixel-head EXPR.accent) */\n  --face-amber: #ebbb63;\n  --face-green: #8fd9a6;\n  --face-blue: #7fb0e3;\n  --face-violet: #b39de8;\n  --face-rose: #e88fae;\n\n  /* Bartel-Pritchard Square scene (pixel-roundabout) */\n  --scene-tree-deep: #2e4a33;\n  --scene-tree-mid: #3f6446;\n  --scene-tree-lit: #5b885a;\n  --scene-plaza: #a68a6e;\n  --scene-plaza-lit: #b59878;\n  --scene-cop-red: #e3524d;\n  --scene-cop-blue: #4d7be3;\n  --scene-fire-red: #d0453f;\n  --scene-fire-amber: #f5d061;\n  --scene-fire-cab: #ededea;\n\n  /* carriageway alphas on the foreground colour */\n  --scene-road-alpha: 0.1; /* @kind other */\n  --scene-marking-alpha: 0.28; /* @kind other */\n  --scene-crosswalk-alpha: 0.38; /* @kind other */\n\n  /* title reveal cards \u2014 fixed themes, independent of the site theme */\n  --reveal-tile-bg: #d0cbc1;\n  --reveal-tile-grout: #d6d2c9;\n  --reveal-tile-stain: #5e130e;\n  --reveal-tile-ink: #1c1a16;\n  --reveal-tile-body: #3a362e;\n  --reveal-tile-faint: #7c776b;\n  --reveal-space-bg: #0a0c11;\n  --reveal-space-ink: #e6e8ee;\n  --reveal-space-body: #aeb3bf;\n  --reveal-space-faint: #727786;\n}\n\n/* One family, four weights, a ramp that leans light. Display sizes get\n   extralight/light with negative tracking; small text gets medium with\n   positive tracking \u2014 the inversion is what makes small type read as a label\n   instead of shrunken body copy. */\n\n:root {\n  --weight-extralight: 200;\n  --weight-light: 300;\n  --weight-normal: 400;\n  --weight-medium: 500;\n\n  /* ramp \u2014 the literal sizes the site ships */\n  --text-display: clamp(1.7rem, 5vw, 2.4rem); /* page title, extralight */\n  --text-h1: 3rem;      /* work-line title, md:text-5xl */\n  --text-h1-sm: 2.25rem;\n  --text-h2: 1.5rem;    /* section heading, light */\n  --text-h3: 1.125rem;  /* card heading, light */\n  --text-body: 1rem;    /* lede paragraphs */\n  --text-sm: 0.875rem;  /* card + nav body */\n  --text-13: 0.8125rem; /* the workhorse: card prose, blurbs */\n  --text-xs: 0.75rem;   /* chips, footer */\n  --text-micro: 0.6875rem; /* the micro-label, mono */\n  --text-10: 0.625rem;  /* scene label, specimen meta */\n\n  --leading-tight: 1.1;\n  --leading-snug: 1.35;\n  --leading-relaxed: 1.625;\n\n  --tracking-tight: -0.02em;\n  --tracking-wordmark: 0.06em; /* header/footer/nav \"circleheads\" voice */\n  --tracking-label: 0.12em;\n  --tracking-micro: 0.18em;    /* MICRO_LABEL */\n}\n\n/* The one type mixin the source shares by string (lib/site.ts MICRO_LABEL):\n   every tiny tracked-uppercase label on the site composes this, so tracking\n   can never drift. */\n.ch-micro-label {\n  font-family: var(--font-mono);\n  font-size: var(--text-micro);\n  letter-spacing: var(--tracking-micro);\n  text-transform: uppercase;\n  line-height: 1.2;\n}\n\n/* 4px base, six steps ever used. Sections breathe at 64, cards pad at 20-24,\n   related things sit 8-12 apart. Constraint is the point. */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;   /* icon to label, chip to chip */\n  --space-3: 12px;  /* buttons in a row, grid gap between cards */\n  --space-4: 16px;  /* inside a card, between blocks */\n  --space-5: 20px;  /* small card padding */\n  --space-6: 24px;  /* card padding (p-6) + the universal page gutter */\n  --space-8: 32px;\n  --space-10: 40px; /* header to first section */\n  --space-14: 56px; /* header block to card grid (mt-14) */\n  --space-16: 64px; /* between sections */\n  --space-20: 80px; /* page top/bottom padding (py-20) */\n  --space-24: 96px; /* hero section padding (py-24) */\n\n  /* layout */\n  --page-max: 72rem;   /* max-w-6xl \u2014 landing, work, about */\n  --prose-max: 36rem;  /* max-w-xl \u2014 a single column of prose */\n  --lede-max: 28rem;   /* max-w-md/sm \u2014 hero copy */\n  --page-inset: var(--space-6);\n  --header-height: 3rem; /* h-12 sticky header */\n\n  /* breakpoints (width only \u2014 there is no isMobile anywhere) */\n  --bp-sm: 640px;\n  --bp-md: 768px;\n  --bp-lg: 1024px;\n}\n\n/* Radius scales with the surface. One border weight everywhere: 1px at token\n   colour. No shadows in the layout system \u2014 depth comes from surface\n   lightness; the only shadow-lg in the source is the popover. */\n\n:root {\n  --radius: 0.625rem; /* 10px \u2014 the scale's root (shadcn --radius) */\n  --radius-sm: calc(var(--radius) * 0.6);  /* 6px  chips, code */\n  --radius-md: calc(var(--radius) * 0.8);  /* 8px  inputs */\n  --radius-lg: var(--radius);              /* 10px */\n  --radius-xl: calc(var(--radius) * 1.4);  /* 14px specimen frames */\n  --radius-2xl: calc(var(--radius) * 1.8); /* 18px CARDS + buttons */\n  --radius-3xl: calc(var(--radius) * 2.2);\n  --radius-4xl: calc(var(--radius) * 2.6);\n  --radius-full: 9999px; /* topic chips, dots */\n\n  --border-width: 1px;\n  --shadow-popover: 0 10px 15px -3px oklch(0 0 0 / 0.1), 0 4px 6px -4px oklch(0 0 0 / 0.1);\n  --ring-focus: 3px;\n\n  /* the edge-fading divider (components/hairline.tsx) */\n  --hairline: linear-gradient(90deg, transparent 0%, var(--border) 14%, var(--border) 86%, transparent 100%);\n}\n\n/* One rule governs everything, including the brand engines: energy moves\n   space, never brightness \u2014 scale, position, displacement. No strobe, no\n   flash, no opacity pulsing. Entrances are motion-safe gated; canvas loops\n   check prefers-reduced-motion and render one representative frame. */\n\n:root {\n  --dur-hover: 150ms; /* @kind other */   /* colour only */\n  --dur-swap: 200ms; /* @kind other */    /* tab content, card hover lift */\n  --dur-media: 300ms; /* @kind other */   /* image hover scale */\n  --dur-reveal: 450ms; /* @kind other */  /* scroll reveal */\n  --dur-entrance: 700ms; /* @kind other *//* hero entrance */\n  --stagger-step: 120ms; /* @kind other */\n\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n\n  /* pixel-engine timeline, seconds (pixel-head.tsx) */\n  --pixel-hold: 1.1s; /* @kind other */\n  --pixel-hold-faces: 25s; /* @kind other */\n  --pixel-dissolve: 1.9s; /* @kind other */\n  --pixel-gone: 0.55s; /* @kind other */\n  --pixel-reform: 1.7s; /* @kind other */\n  --pixel-face-slot: 2.9s; /* @kind other */\n  --pixel-face-morph: 0.5s; /* @kind other */\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root { --dur-hover: 0ms; /* @kind other */ --dur-swap: 0ms; /* @kind other */ --dur-media: 0ms; /* @kind other */ --dur-reveal: 0ms; /* @kind other */ --dur-entrance: 0ms; /* @kind other */ }\n}\n\n/* Minimal base layer, matching the source's @layer base. */\n\n* { border-color: var(--border); outline-color: var(--ring); }\n\nhtml { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }\n\nbody {\n  margin: 0;\n  background: var(--background);\n  color: var(--foreground);\n  font-family: var(--font-sans);\n  font-size: var(--text-sm);\n  line-height: var(--leading-relaxed);\n}\n\nbutton:not(:disabled), [role=\"button\"]:not(:disabled) { cursor: pointer; }\n\na { color: inherit; text-decoration: none; transition: color var(--dur-hover) var(--ease-standard); }\na:hover { color: var(--foreground); }\n\n::selection { background: color-mix(in oklch, var(--foreground) 18%, transparent); }\n\n/* Component layer. Shipped to consumers with the tokens so the primitives\n   land correctly outside this project. Class names are prefixed ch-; every\n   value is lifted from circleheads-site (Base UI / shadcn button + the site\n   components) or the akaSTYLE primitives reference. */\n\n/* ---- micro-label (lib/site.ts MICRO_LABEL) ---------------------------- */\n.ch-micro { font-family: var(--font-mono); font-size: var(--text-micro); letter-spacing: var(--tracking-micro); text-transform: uppercase; color: var(--text-4); line-height: 1.2; }\n\n/* ---- button ---------------------------------------------------------- */\n.ch-btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 6px; border-radius: var(--radius-2xl); border: 1px solid transparent; background-clip: padding-box; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-medium); line-height: 1; white-space: nowrap; user-select: none; height: 32px; padding: 0 12px; transition: all var(--dur-hover) var(--ease-standard); outline: none; }\n.ch-btn:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent); }\n.ch-btn:active:not(:disabled) { transform: translateY(1px); }\n.ch-btn:disabled { pointer-events: none; opacity: 0.5; }\n.ch-btn svg { flex-shrink: 0; width: 16px; height: 16px; pointer-events: none; }\n.ch-btn--xs { height: 24px; padding: 0 10px; gap: 4px; font-size: var(--text-xs); }\n.ch-btn--xs svg { width: 12px; height: 12px; }\n.ch-btn--sm { height: 28px; padding: 0 12px; gap: 4px; }\n.ch-btn--lg { height: 36px; padding: 0 16px; }\n.ch-btn--icon { width: 32px; padding: 0; }\n.ch-btn--icon-xs { width: 24px; height: 24px; padding: 0; }\n.ch-btn--icon-sm { width: 28px; height: 28px; padding: 0; }\n.ch-btn--icon-lg { width: 36px; height: 36px; padding: 0; }\n.ch-btn--default { background: var(--primary); color: var(--primary-foreground); }\n.ch-btn--default:hover { background: color-mix(in oklch, var(--primary) 80%, transparent); }\n.ch-btn--outline { border-color: var(--border); background: var(--background); color: var(--foreground); }\n.ch-btn--outline:hover { background: var(--muted); }\n.dark .ch-btn--outline { background: transparent; }\n.dark .ch-btn--outline:hover { background: color-mix(in oklch, var(--input) 30%, transparent); }\n.ch-btn--secondary { background: var(--secondary); color: var(--secondary-foreground); }\n.ch-btn--secondary:hover { background: color-mix(in oklch, var(--secondary), var(--foreground) 5%); }\n.ch-btn--ghost { background: transparent; color: var(--foreground); }\n.ch-btn--ghost:hover { background: var(--muted); }\n.dark .ch-btn--ghost:hover { background: color-mix(in oklch, var(--muted) 50%, transparent); }\n.ch-btn--destructive { background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }\n.ch-btn--destructive:hover { background: color-mix(in oklch, var(--destructive) 20%, transparent); }\n.dark .ch-btn--destructive { background: color-mix(in oklch, var(--destructive) 20%, transparent); }\n.dark .ch-btn--destructive:hover { background: color-mix(in oklch, var(--destructive) 30%, transparent); }\n.ch-btn--link { background: transparent; color: var(--primary); text-underline-offset: 4px; padding: 0; height: auto; }\n.ch-btn--link:hover { text-decoration: underline; }\n/* the landing hero's one-off: a translucent slab, softer corner */\n.ch-btn--hero { border-radius: var(--radius-md); background: color-mix(in oklch, var(--foreground) 15%, transparent); color: var(--foreground); padding: 0 24px; }\n.ch-btn--hero:hover { background: color-mix(in oklch, var(--foreground) 25%, transparent); }\n\n/* ---- card ------------------------------------------------------------ */\n.ch-card { border-radius: var(--radius-2xl); border: 1px solid var(--rule-soft); background: var(--surface-card); padding: var(--space-6); }\n.ch-card--link { display: block; position: relative; overflow: hidden; transition: all var(--dur-swap) var(--ease-standard); }\n.ch-card--link:hover { background: var(--surface-card-solid); transform: translateY(-2px); }\n.ch-card--dashed { border-style: dashed; border-color: var(--border); background: transparent; }\n.ch-card--dashed:hover { background: var(--surface-card); }\n.ch-card--inset { border-color: color-mix(in oklch, var(--border) 80%, transparent); background: var(--surface-inset); padding: var(--space-4) var(--space-5); }\n.ch-card--flush { padding: 0; }\n\n/* ---- chip / tag ------------------------------------------------------ */\n.ch-chip { display: inline-flex; align-items: center; border-radius: var(--radius-full); border: 1px solid var(--border); padding: 4px 12px; font-size: var(--text-xs); color: var(--text-3); line-height: 1.2; }\n.ch-tag { display: inline-flex; align-items: center; border-radius: var(--radius-sm); border: 1px solid color-mix(in oklch, var(--border) 70%, transparent); background: color-mix(in oklch, var(--muted) 30%, transparent); padding: 2px 8px; font-size: 10.5px; font-weight: var(--weight-medium); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); }\n.ch-tag--bare { background: transparent; border-color: color-mix(in oklch, var(--border) 60%, transparent); padding: 2px 6px; font-size: var(--text-10); letter-spacing: var(--tracking-label); color: var(--text-4); }\n\n/* ---- status dot ------------------------------------------------------ */\n.ch-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: var(--weight-light); }\n.ch-status i { width: 6px; height: 6px; border-radius: var(--radius-full); background: currentColor; }\n\n/* ---- hairline -------------------------------------------------------- */\n.ch-hairline { height: 1px; background: var(--hairline); border: 0; margin: 0; }\n\n/* ---- form controls --------------------------------------------------- */\n.ch-field { display: block; }\n.ch-label { display: block; font-size: var(--text-10); font-weight: var(--weight-medium); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-5); }\n.ch-input { display: block; width: 100%; box-sizing: border-box; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--background); padding: 10px 12px; font-family: var(--font-sans); font-size: var(--text-13); color: var(--foreground); transition: border-color var(--dur-hover) var(--ease-standard); }\n.ch-input::placeholder { color: var(--text-6); }\n.ch-input:focus { outline: none; border-color: color-mix(in oklch, var(--foreground) 30%, transparent); }\n.ch-input--area { min-height: 80px; resize: vertical; line-height: var(--leading-relaxed); }\n.ch-hint { margin: 6px 0 0; font-size: 11px; font-weight: var(--weight-light); color: var(--text-5); }\n.ch-search { display: flex; align-items: center; gap: 8px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--background); padding: 10px 12px; }\n.ch-search input { flex: 1; border: 0; background: transparent; outline: none; font-family: var(--font-sans); font-size: var(--text-13); color: var(--foreground); }\n.ch-search input::placeholder { color: var(--text-6); }\n.ch-search svg { width: 14px; height: 14px; color: var(--text-6); flex-shrink: 0; }\n\n.ch-choice { display: inline-flex; align-items: center; gap: 10px; font-size: var(--text-13); font-weight: var(--weight-light); color: var(--text-3); }\n.ch-choice--on { color: var(--text-2); }\n.ch-box { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; border-radius: 4px; border: 1px solid var(--border); background: var(--background); transition: all var(--dur-hover) var(--ease-standard); }\n.ch-box--on { border-color: color-mix(in oklch, var(--foreground) 40%, transparent); background: var(--foreground); color: var(--background); }\n.ch-box--on svg { width: 12px; height: 12px; }\n.ch-radio { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--background); }\n.ch-radio--on { border-color: color-mix(in oklch, var(--foreground) 40%, transparent); }\n.ch-radio--on i { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--foreground); }\n.ch-toggle { display: inline-flex; align-items: center; width: 36px; height: 20px; flex-shrink: 0; padding: 2px; box-sizing: border-box; border-radius: var(--radius-full); border: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 40%, transparent); transition: background var(--dur-hover) var(--ease-standard); }\n.ch-toggle i { width: 14px; height: 14px; border-radius: var(--radius-full); background: var(--muted-foreground); transition: transform var(--dur-swap) var(--ease-standard); }\n.ch-toggle--on { background: var(--foreground); }\n.ch-toggle--on i { background: var(--background); transform: translateX(16px); }\n\n/* ---- tabs ------------------------------------------------------------ */\n.ch-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-left: -10px; }\n.ch-tab { border: 0; background: transparent; padding: 4px 10px; font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--weight-light); letter-spacing: 0.02em; color: var(--text-5); transition: color var(--dur-hover) var(--ease-standard); }\n.ch-tab:hover { color: var(--foreground); }\n.ch-tab--active { color: var(--text-accent); }\n\n/* ---- menu ------------------------------------------------------------ */\n.ch-menu { min-width: 128px; border-radius: var(--radius-2xl); background: var(--popover); color: var(--popover-foreground); padding: 4px; box-shadow: var(--shadow-popover); outline: 1px solid color-mix(in oklch, var(--foreground) 5%, transparent); }\n.dark .ch-menu { outline-color: color-mix(in oklch, var(--foreground) 10%, transparent); }\n.ch-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 28px; border: 0; background: transparent; border-radius: var(--radius-xl); padding: 6px 8px; font-family: var(--font-sans); font-size: var(--text-sm); color: inherit; text-align: left; transition: background var(--dur-hover) var(--ease-standard); }\n.ch-menu-item:hover, .ch-menu-item:focus-visible { background: var(--accent); color: var(--accent-foreground); outline: none; }\n.ch-menu-sep { height: 1px; margin: 4px -4px; background: color-mix(in oklch, var(--border) 50%, transparent); border: 0; }\n\n/* ---- code ------------------------------------------------------------ */\n.ch-code { border-radius: 4px; background: color-mix(in oklch, var(--muted) 60%, transparent); padding: 2px 4px; font-family: var(--font-mono); font-size: var(--text-xs); }\n.ch-code-block { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid color-mix(in oklch, var(--border) 80%, transparent); background: color-mix(in oklch, var(--muted) 30%, transparent); padding: var(--space-4); margin: 0; font-family: var(--font-mono); font-size: 11px; line-height: var(--leading- text-h2); font-weight: var(--weight-light); letter-spacing: var(--tracking-tight); line-height: 1.2; color: var(--foreground); }\n.ch-sh-stand { margin: 8px 0 0; max-width: var(--prose-max); font-size: var(--text-13); font-weight: var(--weight-light); line-height: var(--leading-relaxed); color: var(--text-3); }\n\n/* ---- quiet inline link (the site's one link treatment) --------------- */\n.ch-link { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-sm); color: var(--text-3); transition: color var(--dur-hover) var(--ease-standard); }\n.ch-link:hover { color: var(--foreground); }\n.ch-link svg { width: 14px; height: 14px; transition: transform var(--dur-hover) var(--ease-standard); }\n.ch-link:hover svg { transform: translate(2px, -2px); }\n.ch-link--accent { color: var(--text-accent); }\n\n/* ---- animation layer -------------------------------------------------\n   The site's entrance and hover motion, lifted from the Tailwind classes it\n   composes (tw-animate-css: animate-in fade-in slide-in-from-bottom-2\n   duration-700 fill-mode-backwards, plus the 120ms stagger). One rule\n   governs all of it: energy moves space, never brightness. */\n@keyframes ch-enter { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }\n@keyframes ch-reveal { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }\n@keyframes ch-fade { from { opacity: 0 } to { opacity: 1 } }\n\n@media (prefers-reduced-motion: no-preference) {\n  /* hero + section entrance; set --step=\"0,1,2\u2026\" for the top-to-bottom stagger */\n  .ch-enter { animation: ch-enter var(--dur-entrance) var(--ease-out) backwards; animation-delay: calc(var(--step, 0) * var(--stagger-step)) }\n  /* scroll reveal: add .is-in when the element enters the viewport */\n  .ch-reveal { opacity: 0 }\n  .ch-reveal.is-in { animation: ch-reveal var(--dur-reveal) var(--ease-out) forwards }\n  /* tab / panel content swap */\n  .ch-fade { animation ection:column;gap:10px\">\n<p style=\"margin:0;font:300 13px/1.65 var(--font-sans);color:rgba(0,0,0,.62);max-width:640px\">What I assumed, so you can correct me: the app never interprets a photo, never scores a condition and never suggests treatment \u2014 every number on screen is something <em>you<\u002Fem> typed. Severity is self-rated. The calendar grid counts logs, not health. Streaks are hard-break as you asked, but the copy around a broken streak stays neutral \u2014 no scolding.<\u002Fp>\n<p style=\"margin:0;font:300 13px/1.65 var(--font-sans);color:rgba(0,0,0,.62);max-width:640px\">The system: warm near-black default with a paper toggle, one border weight, no shadows, ink hierarchy by alpha. Accents are punctuation \u2014 one hue per project, carried consistently from the project card to the body-map hotspot to the calendar cell. The pixel engine does all the brand art: the dermp mark (cross + pencil), tab icons, badges, and the sprite. No photography, no illustration.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"1a\">\n<div class=\"dv-olabel\"><span class=\"dv-oid\">1a<\u002Fspan>the app \u2014 tap through it. 9 screens, both themes.<\u002Fdiv>\n<div style=\"display:flex;gap:20px;align-items:flex-start\">\n<div style=\"position:relative;width:392px;height:812px;border-radius:46px;padding:9px;background:#0a0a09;box-shadow:0 0 0 1px rgba(0,0,0,.14)\">\n<div class=\"{{ themeClass }}\" style=\"position:relative;width:374px;height:794px;border-radius:38px;overflow:hidden;background:var(--background);color:var(--foreground);display:flex;flex-direction:column\">\n\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px;flex:none\">\n<span style=\"font:500 12px var(--font-mono);letter-spacing:.02em;color:var(--text-2)\">{{ clock }}<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:5px\">{{ statusGlyphs }}<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:center;j
